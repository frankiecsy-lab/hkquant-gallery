<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0f14">
  <title data-i18n="admin.pageTitle">管理 — HKQuant Gallery</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <!-- 頂欄：返回圖庫與頁面標題 -->
  <header class="topbar">
    <div class="topbar-text">
      <h1 data-i18n="admin.h1">圖庫管理</h1>
      <p class="subtitle">HKQuant Gallery</p>
    </div>
    <a class="admin-link" href="/" data-i18n="common.back">返回圖庫</a>
  </header>

  <main class="page page-narrow">
    <!-- 未登入：登入卡 -->
    <section id="login-card" class="panel" hidden>
      <h2 data-i18n="admin.login">登入</h2>
      <form id="login-form" novalidate>
        <label for="login-password" data-i18n="admin.password">密碼</label>
        <input type="password" id="login-password" autocomplete="current-password" required>
        <button type="submit" class="btn btn-primary" id="login-submit" data-i18n="admin.login">登入</button>
        <p id="login-msg" class="msg" role="status"></p>
      </form>
    </section>

    <!-- 已登入：管理面板（主頁標題第一位） -->
    <div id="panels" hidden>
      <!-- ① 主頁標題 -->
      <section class="panel">
        <h2 data-i18n="admin.titlePanel">主頁標題</h2>
        <p id="title-current" class="hint">當前標題：—</p>
        <form id="title-form" novalidate>
          <label for="title-input" data-i18n="admin.titleLabel">標題（1–80 字，顯示於圖庫首頁頂欄）</label>
          <input type="text" id="title-input" maxlength="80" placeholder="HKQuant Gallery" autocomplete="off">
          <button type="submit" class="btn btn-primary" id="title-submit" data-i18n="admin.saveTitle">保存標題</button>
          <p id="title-msg" class="msg" role="status"></p>
        </form>
      </section>

      <!-- ② 圖庫資料夾設定 -->
      <section class="panel">
        <h2 data-i18n="admin.rootPanel">圖庫資料夾</h2>
        <p id="root-current" class="hint">當前圖庫資料夾：—</p>
        <form id="root-form" novalidate>
          <label for="root-input" data-i18n="admin.rootLabel">資料夾路徑（相對 FTP 根目錄）</label>
          <input type="text" id="root-input" placeholder=".（FTP 根目錄）" data-i18n-ph="admin.rootPh" autocomplete="off">
          <button type="submit" class="btn btn-primary" id="root-submit" data-i18n="admin.save">保存</button>
          <p id="root-msg" class="msg" role="status"></p>
        </form>
      </section>

      <!-- ③ FTP 儲存容量 -->
      <section class="panel">
        <h2 data-i18n="admin.storagePanel">FTP 儲存容量</h2>
        <div class="bar" aria-hidden="true"><div id="storage-bar" class="bar-fill"></div></div>
        <p id="storage-text" class="hint" data-i18n="admin.reading">讀取中…</p>
        <p id="storage-msg" class="msg" role="status"></p>
      </section>

      <!-- ④ 查看密碼（首頁看相閘門） -->
      <section class="panel">
        <h2 data-i18n="admin.viewPanel">查看密碼</h2>
        <p id="view-current" class="hint">當前台區：—</p>
        <form id="view-form" novalidate>
          <label for="view-code" data-i18n="admin.viewLabel">數字密碼（4–12 位，訪客於首頁用數字鍵盤輸入）</label>
          <input type="text" id="view-code" inputmode="numeric" pattern="[0-9]*" maxlength="12" placeholder="例如 246810" data-i18n-ph="admin.codePh" autocomplete="off">
          <label for="view-code2" data-i18n="admin.confirmCode">確認密碼</label>
          <input type="text" id="view-code2" inputmode="numeric" pattern="[0-9]*" maxlength="12" placeholder="再輸入一次" data-i18n-ph="admin.codePh2" autocomplete="off">
          <div class="btn-row">
            <button type="submit" class="btn btn-primary" id="view-save" data-i18n="admin.saveCode">保存密碼</button>
            <button type="button" class="btn" id="view-toggle" data-i18n="admin.enableGate">啟用閘門</button>
          </div>
          <p id="view-msg" class="msg" role="status"></p>
        </form>
      </section>

      <!-- ⑤ 修改密碼 -->
      <section class="panel">
        <h2 data-i18n="admin.pwdPanel">修改密碼</h2>
        <form id="pwd-form" novalidate>
          <label for="pwd-old" data-i18n="admin.oldPw">原密碼</label>
          <input type="password" id="pwd-old" autocomplete="current-password" required>
          <label for="pwd-new" data-i18n="admin.newPw">新密碼（至少 8 個字符）</label>
          <input type="password" id="pwd-new" autocomplete="new-password" required>
          <label for="pwd-confirm" data-i18n="admin.confirmPw">確認新密碼</label>
          <input type="password" id="pwd-confirm" autocomplete="new-password" required>
          <button type="submit" class="btn btn-primary" id="pwd-submit" data-i18n="admin.updatePw">更新密碼</button>
          <p id="pwd-msg" class="msg" role="status"></p>
        </form>
      </section>

      <!-- ⑥ 人臉索引 -->
      <section class="panel">
        <h2 data-i18n="admin.facePanel">人臉索引</h2>
        <p class="hint" data-i18n="admin.faceHint">訪客可用自拍搜尋包含相同人物的相片。上傳新相後請重建索引（背景逐張進行）。</p>
        <p id="face-status" class="hint">—</p>
        <button type="button" class="btn btn-primary" id="face-rebuild" data-i18n="admin.faceRebuild">建立／重建索引</button>
        <form id="face-idle-form" novalidate>
          <label for="face-idle" data-i18n="admin.faceUnloadLabel">模型閒置卸載時間（分鐘；0＝常駐記憶體）</label>
          <input type="number" id="face-idle" min="0" max="240" step="1" inputmode="numeric" autocomplete="off">
          <button type="submit" class="btn" id="face-idle-save" data-i18n="admin.faceUnloadSave">保存卸載時間</button>
        </form>
        <p id="face-msg" class="msg" role="status"></p>
      </section>

      <!-- ⑦ 危險區域 -->
      <section class="panel">
        <h2 data-i18n="admin.dangerPanel">危險區域</h2>
        <p class="hint" data-i18n="admin.dangerHint">一鍵刪除當前圖庫資料夾內全部相片與視頻（含已隱藏；非媒體檔案保留）。此操作無法還原。</p>
        <button type="button" class="btn btn-danger" id="delete-all-btn" data-i18n="admin.dangerBtn">一鍵全部刪除</button>
        <form id="delete-all-form" hidden novalidate>
          <label for="delete-all-pw" data-i18n="admin.dangerPwLabel">管理密碼（二次確認）</label>
          <input type="password" id="delete-all-pw" autocomplete="current-password" required>
          <button type="submit" class="btn btn-danger" id="delete-all-confirm" data-i18n="admin.dangerConfirm">確認刪除全部媒體</button>
        </form>
        <p id="delete-all-msg" class="msg" role="status"></p>
      </section>

      <!-- ⑧ 登出 -->
      <section class="panel">
        <h2 data-i18n="admin.logoutPanel">登出</h2>
        <p class="hint" data-i18n="admin.logoutHint">結束當前管理工作階段。</p>
        <button type="button" class="btn btn-danger" id="logout-btn" data-i18n="admin.logout">登出</button>
        <p id="logout-msg" class="msg" role="status"></p>
      </section>
    </div>
  </main>

  <script src="/i18n.js"></script>
  <script src="/footer.js"></script>
  <script src="/admin.js"></script>
</body>
</html>
