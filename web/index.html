<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0f14">
  <title>HKQuant Gallery</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <!-- 頂欄：標題、人臉搜尋與設置入口（管理入口在頁腳） -->
  <header class="topbar">
    <div class="topbar-text">
      <h1 id="gallery-title">HKQuant Gallery</h1>
    </div>
    <div class="topbar-actions">
      <button type="button" class="face-btn" id="face-btn" data-i18n="index.face">人臉搜尋</button>
      <a class="admin-link" href="/settings" data-i18n="index.settings">設置</a>
    </div>
  </header>

  <main class="page">
    <!-- 資料夾可見性與排序已遷至「設置」頁全局配置 -->
    <!-- 行內狀態提示：載入中／空圖庫／失敗 -->
    <p id="status" class="status" role="status" data-i18n="index.loading">載入中…</p>
    <!-- 人臉匹配橫幅：只過濾本頁顯示，不影響全局設置 -->
    <div id="dl-banner" class="face-banner dl-banner" role="status" hidden>
      <span id="dl-info"></span>
      <button type="button" class="face-reset" id="dl-all" data-i18n="dl.all">全選</button>
      <button type="button" class="face-reset" id="dl-go" disabled data-i18n="dl.go">下載 ZIP</button>
      <button type="button" class="face-reset" id="dl-exit" data-i18n="dl.exit">退出</button>
    </div>
    <p id="face-banner" class="face-banner" role="status" hidden>
      <span id="face-banner-text"></span>
      <button type="button" id="face-reset" class="face-reset" data-i18n="face.showAll">返回全部</button>
    </p>
    <div id="gallery" class="gallery" hidden></div>

    <!-- 分頁（照片多時） -->
    <nav class="pager" id="pager" aria-label="分頁" data-i18n-aria="index.pagerAria" hidden></nav>
  </main>

  <!-- 頁腳由 /footer.js 全域統一生成（首頁／管理／設置同款同步） -->

  <!-- 查看密码闸门：服务器返回 403 时显示，内置数字键盘方便手机输入 -->
  <div id="gate" class="gate" hidden aria-modal="true" role="dialog" aria-label="查看密碼" data-i18n-aria="gate.title">
    <div class="gate-card">
      <h2 data-i18n="gate.title">查看密碼</h2>
      <div class="gate-dots" id="gate-dots" aria-hidden="true"></div>
      <p id="gate-msg" class="msg" role="status"></p>
      <div class="pad" id="gate-pad"></div>
    </div>
  </div>

  <!-- 人臉搜尋卡：自拍（或揀相）→ POST /api/face/search → 主頁只顯示匹配相片 -->
  <div id="face-modal" class="gate" hidden aria-modal="true" role="dialog" aria-label="人臉搜尋" data-i18n-aria="face.title">
    <div class="gate-card face-card">
      <h2 data-i18n="face.title">人臉搜尋</h2>
      <p class="face-hint" data-i18n="face.hint">拍攝一張自拍或從相簿選擇，頁面將只顯示包含相同人物的相片。</p>
      <img id="face-preview" class="face-preview" alt="" hidden>
      <input type="file" id="face-file" accept="image/*" capture="user" hidden>
      <button type="button" id="face-pick" class="btn btn-block" data-i18n="face.pick">拍攝／選擇照片</button>
      <button type="button" id="face-go" class="btn btn-primary btn-block" disabled data-i18n="face.search">開始搜尋</button>
      <p id="face-msg" class="msg" role="status"></p>
      <button type="button" id="face-close" class="btn btn-block" data-i18n="face.cancel">取消</button>
    </div>
  </div>

  <!-- 全螢幕預覽（lightbox）：序號範圍＝全部項目（跨頁連貫，翻頁自動跟隨分頁）；
       圖片與視頻統一顯示貼媒體邊緣的 ‹ › 翻頁圓鍵（圖片另支援左右半區點擊）；
       視頻用原生控件播放；說明三行＝檔名／分辨率／時間＋項數 -->
  <div id="lightbox" class="lightbox" hidden aria-modal="true" role="dialog" aria-label="圖片預覽" data-i18n-aria="index.lightboxAria">
    <button type="button" class="lb-btn lb-close" id="lb-close" aria-label="關閉">&times;</button>
    <a id="lb-download" class="lb-btn lb-download" href="#" download aria-label="下載" title="下載" data-i18n-aria="index.download" hidden>&#11015;</a>
    <figure class="lb-figure">
      <!-- 媒體層：翻頁圓鍵錨定於此（貼媒體左右緣、垂直置中），圖片與視頻統一 -->
      <div class="lb-media">
        <img id="lb-img" alt="" class="lb-half-nav">
        <video id="lb-video" controls playsinline hidden></video>
        <button type="button" class="lb-btn lb-prev" id="lb-prev" aria-label="上一張" title="上一張" data-i18n-aria="index.prevItem"></button>
        <button type="button" class="lb-btn lb-next" id="lb-next" aria-label="下一張" title="下一張" data-i18n-aria="index.nextItem"></button>
      </div>
      <figcaption class="lb-caption">
        <span id="lb-name" class="lb-name"></span>
        <span id="lb-res" class="lb-res"></span>
        <span id="lb-index" class="lb-index"></span>
      </figcaption>
    </figure>
  </div>

  <!-- ZIP 下載：表單 POST 觸發瀏覽器原生下載（x-www-form-urlencoded，後端內建解析）；
       後端報錯時 JSON 會渲染於隱藏 iframe，同頁讀出轉為橫幅提示 -->
  <form id="dl-form" method="post" action="/api/download/zip" target="dl-frame" hidden>
    <input type="hidden" name="paths" id="dl-paths">
  </form>
  <iframe id="dl-frame" name="dl-frame" title="" aria-hidden="true" hidden></iframe>

  <script src="/i18n.js"></script>
  <script src="/footer.js"></script>
  <script src="/app.js"></script>
</body>
</html>
