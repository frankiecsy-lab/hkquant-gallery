<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0f14">
  <title>HKQuant Gallery</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <!-- 頂欄：標題與設置入口（管理入口在頁腳） -->
  <header class="topbar">
    <div class="topbar-text">
      <h1 id="gallery-title">HKQuant Gallery</h1>
    </div>
    <a class="admin-link" href="/settings" data-i18n="index.settings">設置</a>
  </header>

  <main class="page">
    <!-- 資料夾可見性與排序已遷至「設置」頁全局配置 -->
    <!-- 行內狀態提示：載入中／空圖庫／失敗 -->
    <p id="status" class="status" role="status" data-i18n="index.loading">載入中…</p>
    <div id="gallery" class="gallery" hidden></div>

    <!-- 分頁（照片多時） -->
    <nav class="pager" id="pager" aria-label="分頁" data-i18n-aria="index.pagerAria" hidden></nav>
  </main>

  <!-- 頁腳由 /footer.js 全域統一生成（首頁／管理／設置同款同步） -->

  <!-- 查看密码闸门：服务器返回 403 时显示，内置数字键盘方便手机输入 -->
  <div id="gate" class="gate" hidden aria-modal="true" role="dialog" aria-label="查看密碼" data-i18n-aria="gate.title">
    <div class="gate-card">
      <h2 data-i18n="gate.title">查看密碼</h2>
      <div class="gate-dots" id="gate-dots" aria-hidden="true"></div>
      <p id="gate-msg" class="msg" role="status"></p>
      <div class="pad" id="gate-pad"></div>
    </div>
  </div>

  <!-- 全螢幕預覽（lightbox）：圖片時左半＝上一張、右半＝下一張；視頻用原生控件播放 -->
  <div id="lightbox" class="lightbox" hidden aria-modal="true" role="dialog" aria-label="圖片預覽" data-i18n-aria="index.lightboxAria">
    <button type="button" class="lb-btn lb-close" id="lb-close" aria-label="關閉">&times;</button>
    <a id="lb-download" class="lb-btn lb-download" href="#" download aria-label="下載" title="下載" data-i18n-aria="index.download" hidden>&#11015;</a>
    <figure class="lb-figure">
      <img id="lb-img" alt="" class="lb-half-nav">
      <video id="lb-video" controls playsinline hidden></video>
      <figcaption class="lb-caption">
        <span id="lb-name" class="lb-name"></span>
        <span id="lb-index" class="lb-index"></span>
      </figcaption>
    </figure>
  </div>

  <script src="/i18n.js"></script>
  <script src="/footer.js"></script>
  <script src="/app.js"></script>
</body>
</html>
